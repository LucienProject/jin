# Ollama tourne sur l'hôte (localhost:11434).
# Caddy ajoute l'auth par token sur localhost:8080, cloudflared l'expose en HTTPS.
services:
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://localhost:8080
    depends_on:
      - caddy
    profiles: ["public"]

  # Interface de chat Symfony protégée par mot de passe (./set-password.sh), sur http://localhost:8000
  # En mode prod : exposable publiquement (ngrok) sans fuite de traces d'erreur.
  web:
    image: php:8.5-cli
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./web:/app
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?lancer ./set-password.sh}
      JIN_API_URL: http://localhost:8080
      JIN_API_TOKEN: ${API_TOKEN}
      JIN_UI_PASSWORD_HASH: ${JIN_UI_PASSWORD_HASH:?lancer ./set-password.sh}
      SEARXNG_URL: http://127.0.0.1:8888
      IMAGEGEN_URL: http://127.0.0.1:8890
      SPEECH_URL: http://127.0.0.1:8891
      PHP_CLI_SERVER_WORKERS: 4
    command: >-
      sh -c "php bin/console cache:clear
      && php bin/console asset-map:compile
      && exec php -d upload_max_filesize=20M -d post_max_size=21M -d memory_limit=512M -S 127.0.0.1:8000 -t public"
    depends_on:
      - caddy
      - searxng

  # Méta-moteur de recherche pour l'outil web_search des modèles, sur http://127.0.0.1:8888
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?à définir dans .env (openssl rand -hex 32)}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  # Génération d'images (Z-Image-Turbo) pour le bouton 🖼 du chat, sur http://127.0.0.1:8890
  # Nécessite le NVIDIA Container Toolkit. Premier démarrage : téléchargement du modèle (≈ 20 Go).
  # Décharge les modèles d'Ollama avant chaque image (la VRAM ne suffit pas pour les deux).
  imagegen:
    build: ./imagegen
    network_mode: host
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://127.0.0.1:11434
      HF_HOME: /cache
    volumes:
      - imagegen-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            # GPU 0 : en PCIe x8 (le GPU 1 n'est qu'en x1, trop lent pour les allers-retours RAM ↔ VRAM)
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    profiles: ["images"]

  # Transcription de la voix (Whisper large-v3-turbo) pour le bouton 🎤 du chat, sur http://127.0.0.1:8891
  # Sur CPU : les GPU sont pris par Ollama. Premier démarrage : téléchargement du modèle (≈ 1,6 Go).
  speech:
    build: ./speech
    network_mode: host
    restart: unless-stopped
    environment:
      HF_HOME: /cache
      # le téléchargeur Xet de Hugging Face cale ici ; le HTTP classique fonctionne
      HF_HUB_DISABLE_XET: 1
    volumes:
      - speech-cache:/cache

  # Expose l'interface web sur le domaine ngrok fixe (NGROK_DOMAIN dans .env)
  ngrok:
    image: ngrok/ngrok:latest
    network_mode: host
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?à définir dans .env}
    command: http 8000 --url=${NGROK_DOMAIN:?à définir dans .env} --log=stdout
    depends_on:
      - web
    profiles: ["ngrok"]

volumes:
  imagegen-cache:
  speech-cache:
