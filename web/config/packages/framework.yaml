# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # ngrok se connecte depuis la machine : on fait confiance à ses en-têtes X-Forwarded-*
    # (HTTPS d'origine, IP réelle du visiteur pour la limite de tentatives de connexion)
    trusted_proxies: '127.0.0.1,::1'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']

    http_client:
        scoped_clients:
            jin.client:
                base_uri: '%env(JIN_API_URL)%'
                auth_bearer: '%env(JIN_API_TOKEN)%'
                # le premier appel à un modèle peut attendre son chargement en VRAM
                timeout: 300
            searxng.client:
                base_uri: '%env(SEARXNG_URL)%'
                timeout: 15
            imagegen.client:
                base_uri: '%env(IMAGEGEN_URL)%'
                # déchargement d'Ollama + génération ; plus long au premier passage
                timeout: 300
            speech.client:
                base_uri: '%env(SPEECH_URL)%'
                timeout: 120

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
